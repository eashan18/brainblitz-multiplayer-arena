<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Decorative Glow Orbs -->
  <circle cx="200" cy="180" r="160" fill="#6366f1" opacity="0.18" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="180" fill="#38bdf8" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="550" r="140" fill="#ec4899" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid Lines / Matrix Background Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Center Card Frame -->
  <rect x="180" y="85" width="840" height="460" rx="24" fill="rgba(18, 26, 44, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Badge -->
  <rect x="475" y="130" width="250" height="34" rx="17" fill="rgba(99, 102, 241, 0.2)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5"/>
  <text x="600" y="152" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">HANDSHAKE × OPENAI</text>

  <!-- Title -->
  <text x="600" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="-1" text-anchor="middle">
    BRAINBLITZ <tspan fill="#38bdf8">ARENA</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="285" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" text-anchor="middle">
    Real-Time Multiplayer Party Challenge with Instant Room Codes
  </text>

  <!-- Feature Tags -->
  <g transform="translate(250, 340)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="200" height="48" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="100" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">⚡ 4-Letter Rooms</text>

    <!-- Tag 2 -->
    <rect x="235" y="0" width="220" height="48" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="345" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">📱 Cross-Device Sync</text>

    <!-- Tag 3 -->
    <rect x="490" y="0" width="210" height="48" rx="12" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="595" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">🤖 Smart AI Bots</text>
  </g>

  <!-- Player Avatars row -->
  <g transform="translate(420, 435)" font-size="34">
    <text x="0" y="30">🦊</text>
    <text x="70" y="30">🤖</text>
    <text x="140" y="30">🚀</text>
    <text x="210" y="30">👾</text>
    <text x="280" y="30">🐱</text>
    <text x="350" y="30">⚡</text>
  </g>

  <!-- Footer Tag -->
  <text x="600" y="590" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1" text-anchor="middle">
    FULL-DUPLEX WEBSOCKETS + WEBAUDIO SOUND ENGINE + GLASSMORPHISM UI
  </text>
</svg>
